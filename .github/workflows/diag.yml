name: Diagnose (temporary)
on: workflow_dispatch
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Simulate client + call API
        shell: pwsh
        run: |
          $d = "C:\Users\runneradmin\Downloads\Nihor2 - Chronicles of Jinteia"
          New-Item -ItemType Directory -Force -Path "$d\loot_history_archive" | Out-Null
          Set-Content -Path "$d\info_chat_loot.log" -Value "[12/10/26] [10:00:00]: You receive 1 Yang.`r`n[12/10/26] [10:00:01]: You receive 1 Elite Splinter."
